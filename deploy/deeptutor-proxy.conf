server {
    listen 80;
    server_name _;
    client_max_body_size 210m;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    location = /api/v1/ws {
        proxy_pass http://bp-deeptutor-product:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://bp-deeptutor-product:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location = /_lwo/client-context {
        proxy_pass http://llm-web-observer:8080/v1/client-context;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /_lwo/client.js {
        proxy_pass http://llm-web-observer:8080/static/client.js;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://bp-deeptutor-product:3782;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter '</head>' '<script src="/_lwo/client.js"></script></head>';
    }
}
