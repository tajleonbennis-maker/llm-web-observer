[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-web-observer"
version = "0.1.0"
description = "End-to-end observability for multi-user LLM Web applications"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["services/collector/llm_web_observer"]

[tool.pytest.ini_options]
testpaths = ["services/collector/tests", "packages/python-sdk/tests"]
pythonpath = ["services/collector", "packages/python-sdk"]

